name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      # Set DATABASE_URL to a dedicated staging database secret when available.
      # The fallback is intentionally unreachable and only exercises build-time compilation.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://ci:ci@db.invalid:5432/scholarhub_ci' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

  mobile:
    name: Mobile lint, types, and Expo validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_BASE: https://ci.invalid.example
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.1.3

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate Expo SDK dependency versions
        run: pnpm exec expo install --check

      - name: Expo Doctor
        run: pnpm doctor

      - name: Android export smoke test
        run: pnpm exec expo export --platform android
