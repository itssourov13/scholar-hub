# Keep the web app as its own pnpm root (separate from the mobile workspace).
packages: []

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  '@xmldom/xmldom': 0.8.15
  baseline-browser-mapping: 2.11.30
  browserslist: 4.29.4
  source-map-js: 1.2.2
  'nanoid@3': 3.3.20
  '@babel/core': 7.29.7
  postcss: 8.5.31
  # mammoth uses argparse only for its CLI; the app uses extractRawText.
  # The argparse v1 dependency pulls in sprintf-js with no published patched release.
  'mammoth>argparse': 2.0.1
